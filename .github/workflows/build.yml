name: Build

# Roda os testes (Linux) e compila (Windows) a cada push e pull request. Num push na main, se a <Version> do .csproj ainda não tem
# release (tag v<versão> inexistente), cria a tag e a release com o WslSyncMonitor.exe anexado.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Testes
        run: dotnet test tests -c Release

  build:
    needs: tests # sem testes passando não há build nem release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # precisa das tags para saber se a versão já foi publicada

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Versão
        id: ver
        shell: bash
        run: |
          v=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/WslSyncMonitor.csproj)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publicar
        shell: bash
        run: >
          dotnet publish src -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true -p:DebugType=none
          -p:Version=${{ steps.ver.outputs.version }} -o out

      - uses: actions/upload-artifact@v4
        with:
          name: WslSyncMonitor
          path: out/WslSyncMonitor.exe

      - name: Release
        if: github.event_name == 'push' && steps.ver.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ steps.ver.outputs.version }}
          files: out/WslSyncMonitor.exe
          generate_release_notes: true
          body: |
            Requer o [.NET 8 Desktop Runtime (x64)](https://dotnet.microsoft.com/download/dotnet/8.0).
            O `.exe` não é assinado: o SmartScreen pode pedir confirmação (*Mais informações → Executar assim mesmo*).
