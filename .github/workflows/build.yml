name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Versão a partir da tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: echo "VERSION_ARG=-p:Version=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Publicar
        shell: bash
        run: >
          dotnet publish src -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true -p:DebugType=none $VERSION_ARG -o out

      - uses: actions/upload-artifact@v4
        with:
          name: WslSyncMonitor
          path: out/WslSyncMonitor.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/WslSyncMonitor.exe
          generate_release_notes: true
