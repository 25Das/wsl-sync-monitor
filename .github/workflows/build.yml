name: Build

# Roda os testes (Linux) e compila (Windows) a cada push e pull request. Num push na main, se a <Version> do .csproj ainda não tem
# release (tag v<versão> inexistente), cria a tag e a release com o WslSyncMonitor.exe anexado.

on:
  push:
    branches: ['**'] # todo branch roda os testes; release só pela main (condição no passo Release)
  pull_request:

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Testes
        run: dotnet test tests -c Release --logger GitHubActions

      # o build do Windows já usou código com CRLF (git autocrlf), o que quebrou os scripts de shell;
      # os testes rodam de novo com o código convertido para garantir que isso não volte a acontecer
      - name: Testes com o código em CRLF
        run: |
          sed -i 's/$/\r/' src/*.cs
          dotnet test tests -c Release --logger GitHubActions

  # testes do código de interface (WinForms), que só roda no Windows
  windows-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Testes de interface
        run: >
          dotnet test tests.windows -c Release --logger GitHubActions --blame-crash
          --collect "Code Coverage;Format=cobertura" --results-directory "${{ runner.temp }}/cobertura"
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/evidencias

      # as regras puras também rodam aqui só para medir a cobertura do código todo num lugar
      # (no Windows, o coletor da Microsoft: o coverlet não consegue instrumentar o assembly WinForms)
      - name: Cobertura
        if: always()
        shell: bash
        run: |
          dotnet test tests -c Release --collect:"XPlat Code Coverage" --settings tests/coverage.runsettings \
            --results-directory "$RUNNER_TEMP/cobertura" > "$RUNNER_TEMP/cobertura-regras.log" 2>&1 || true
          mkdir -p "$RUNNER_TEMP/evidencias"
          mapfile -t reports < <(find "$RUNNER_TEMP/cobertura" -name '*.cobertura.xml')
          python tools/coverage-summary.py "${reports[@]}" > "$RUNNER_TEMP/evidencias/cobertura.md"
          { echo; echo "Relatórios lidos: ${#reports[@]}"; for r in "${reports[@]}"; do echo "- ${r#$RUNNER_TEMP/}"; done
            echo; echo '```'; tail -5 "$RUNNER_TEMP/cobertura-regras.log"; echo '```'; } >> "$RUNNER_TEMP/evidencias/cobertura.md"
          cat "$RUNNER_TEMP/evidencias/cobertura.md" >> "$GITHUB_STEP_SUMMARY"

      # capturas de tela geradas pelos testes, publicadas no branch ci-evidencias (pasta = nome do branch) para
      # conferir o visual sem um Windows. O branch tem sempre um único commit, e pastas de branches apagados saem.
      - name: Publicar capturas de tela
        if: always() && github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          src="$RUNNER_TEMP/evidencias"
          [ -d "$src" ] || { echo "sem capturas"; exit 0; }
          folder="${GITHUB_REF_NAME//\//-}"
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            rm -rf "$RUNNER_TEMP/ev" && mkdir "$RUNNER_TEMP/ev" && cd "$RUNNER_TEMP/ev"
            git init -q && git remote add origin "$url"
            lease=""
            if git fetch -q --depth 1 origin ci-evidencias; then
              git checkout -q FETCH_HEAD -- . 2>/dev/null || true
              lease="--force-with-lease=ci-evidencias:$(git rev-parse FETCH_HEAD)"
            else
              lease="--force-with-lease=ci-evidencias:"
            fi
            # remove pastas de branches que não existem mais
            branches=$(git ls-remote --heads origin | sed 's:.*refs/heads/::; s:/:-:g')
            for d in */; do
              d="${d%/}"
              if [ -d "$d" ] && ! grep -qx -- "$d" <<<"$branches"; then rm -rf "$d"; fi
            done
            rm -rf "$folder" && cp -r "$src" "$folder"
            echo "$GITHUB_SHA" > "$folder/commit.txt"
            git add -A
            tree=$(git write-tree)
            commit=$(git commit-tree "$tree" -m "Capturas de tela de $GITHUB_REF_NAME ($GITHUB_SHA)")
            if git push -q $lease origin "$commit:refs/heads/ci-evidencias"; then echo "publicado em ci-evidencias/$folder"; exit 0; fi
            sleep $((attempt * 3))
          done
          echo "::warning::não foi possível publicar as capturas de tela"

  build:
    needs: [tests, windows-tests] # sem testes passando não há build nem release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # precisa das tags para saber se a versão já foi publicada

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Versão
        id: ver
        shell: bash
        run: |
          v=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/WslSyncMonitor.csproj)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publicar
        shell: bash
        run: >
          dotnet publish src -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true -p:DebugType=none
          -p:Version=${{ steps.ver.outputs.version }} -o out

      - uses: actions/upload-artifact@v4
        with:
          name: WslSyncMonitor
          path: out/WslSyncMonitor.exe

      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.ver.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ steps.ver.outputs.version }}
          files: out/WslSyncMonitor.exe
          generate_release_notes: true
          body: |
            Requer o [.NET 8 Desktop Runtime (x64)](https://dotnet.microsoft.com/download/dotnet/8.0).
            O `.exe` não é assinado: o SmartScreen pode pedir confirmação (*Mais informações → Executar assim mesmo*).
